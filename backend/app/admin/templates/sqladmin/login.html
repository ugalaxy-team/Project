{% extends "sqladmin/base.html" %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100 px-3">
  <div class="col-lg-5 col-md-7 col-sm-10">
    <form id="firebase-admin-login-form" class="card card-md" action="{{ url_for('admin:login') }}" method="POST"
      autocomplete="off">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Login to {{ admin.title if admin else 'Admin' }}</h2>
        <p class="text-secondary text-center mb-4">Use your Firebase account. Only users with the backend
          <code>admin</code> role can continue.
        </p>

        <div class="mb-3">
          <label class="form-label" for="admin-email">Email</label>
          <input id="admin-email" name="email" type="email" class="form-control{% if error %} is-invalid{% endif %}"
            placeholder="you@example.com" autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="admin-password">Password</label>
          <input id="admin-password" type="password" class="form-control{% if error %} is-invalid{% endif %}"
            placeholder="Password" autocomplete="current-password" required>
          {% if error %}
          <div class="invalid-feedback d-block">{{ error }}</div>
          {% endif %}
        </div>

        <input id="admin-id-token" name="id_token" type="hidden">

        <div id="firebase-login-error" class="alert alert-danger d-none" role="alert"></div>

        <div class="form-footer">
          <button id="firebase-login-submit" type="submit" class="btn btn-primary w-100">Sign in with Firebase</button>
        </div>

        <div class="hr-text my-4">or</div>

        <button id="google-signin-btn" type="button" class="btn btn-outline-dark w-100">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {{ firebase_config | tojson }};
  const form = document.getElementById("firebase-admin-login-form");
  const submitButton = document.getElementById("firebase-login-submit");
  const googleButton = document.getElementById("google-signin-btn");
  const errorBox = document.getElementById("firebase-login-error");
  const emailInput = document.getElementById("admin-email");
  const passwordInput = document.getElementById("admin-password");
  const idTokenInput = document.getElementById("admin-id-token");

  const showError = (message) => {
    errorBox.textContent = message;
    errorBox.classList.remove("d-none");
  };

  if (!firebaseConfig.apiKey || !firebaseConfig.authDomain || !firebaseConfig.projectId || !firebaseConfig.appId) {
    showError("Firebase admin login is not configured on the backend.");
    submitButton.disabled = true;
    googleButton.disabled = true;
  } else {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.add("d-none");
      submitButton.disabled = true;
      submitButton.textContent = "Signing in...";

      try {
        const credentials = await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value,
        );
        idTokenInput.value = await credentials.user.getIdToken();
        form.submit();
      } catch (error) {
        const message = error && typeof error === "object" && "message" in error
          ? error.message
          : "Firebase sign-in failed.";
        showError(message);
        submitButton.disabled = false;
        submitButton.textContent = "Sign in with Firebase";
      }
    });

    const googleButtonOriginalHTML = googleButton.innerHTML;

    googleButton.addEventListener("click", async () => {
      errorBox.classList.add("d-none");
      googleButton.disabled = true;
      googleButton.textContent = "Signing in...";

      try {
        const provider = new GoogleAuthProvider();
        const credentials = await signInWithPopup(auth, provider);
        idTokenInput.value = await credentials.user.getIdToken();
        form.submit();
      } catch (error) {
        const message = error && typeof error === "object" && "message" in error
          ? error.message
          : "Google sign-in failed.";
        showError(message);
        googleButton.disabled = false;
        googleButton.innerHTML = googleButtonOriginalHTML;
      }
    });
  }
</script>
{% endblock %}
